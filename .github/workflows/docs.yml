name: docs
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar que existen Markdown
        run: |
          set -e
          n=$(find . -name '*.md' -not -path './.git/*' | wc -l)
          echo "Markdown files: $n"
          test "$n" -ge 1
